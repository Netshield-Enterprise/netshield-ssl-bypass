name: AI PR Code Reviewer

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.repository }}-${{ github.event.pull_request.number || github.head_ref || github.sha }}-${{ github.workflow }}-${{ github.event_name == 'pull_request_review_comment' && 'pr_comment' || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      
      - name: AI PR Reviewer
        uses: coderabbitai/openai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          openai_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
          openai_light_model: "gemini-1.5-flash"
          openai_heavy_model: "gemini-1.5-pro"
          system_message: |
            You are an expert DevSecOps engineer and Python developer.
            Please review this PR, looking for:
            - Security issues and vulnerabilities
            - Code quality, readability, and maintainability
            - Best practices in Python and Frida scripting
            - Potential bugs and edge cases
            Provide concise, actionable feedback.
